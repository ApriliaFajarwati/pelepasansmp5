<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Layar Utama – Pelepasan Kelas IX SMP N 5 Klaten</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060E1E;}

/* ── ANIMATED BG ── */
.bg-layer{position:fixed;inset:0;z-index:0;}
.bg-gradient{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(21,101,192,0.35) 0%, transparent 70%),
             radial-gradient(ellipse 60% 50% at 20% 100%, rgba(212,175,55,0.12) 0%, transparent 60%),
             linear-gradient(160deg,#060E1E 0%,#0D1F3C 50%,#060E1E 100%);
}
.particles{position:absolute;inset:0;overflow:hidden;}
.particle{
  position:absolute;pointer-events:none;
  animation:particleFall linear infinite;
  opacity:0;
}
@keyframes particleFall{
  0%  {transform:translateY(-20px) rotate(0deg);opacity:0;}
  10% {opacity:1;}
  90% {opacity:.6;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

/* ── IDLE SCREEN ── */
#idleScreen{
  position:fixed;inset:0;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px;
  transition:all .8s ease;
}
.idle-logo{
  font-size:5rem;margin-bottom:28px;
  filter:drop-shadow(0 0 20px rgba(212,175,55,0.6));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.idle-school{
  font-family:'Cinzel',serif;
  font-size:clamp(1rem,3vw,1.5rem);
  color:var(--gold);letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:12px;
}
.idle-event{
  font-family:'Cinzel',serif;
  font-size:clamp(2rem,6vw,5rem);
  font-weight:900;
  background:linear-gradient(135deg,#F5D96B,#D4AF37,#A07C1E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.1;margin-bottom:16px;
}
.idle-year{
  font-size:clamp(1rem,2.5vw,1.4rem);
  color:rgba(255,255,255,.7);margin-bottom:40px;
}
.idle-hint{
  display:flex;align-items:center;gap:12px;
  background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);
  border-radius:50px;padding:14px 32px;
  color:rgba(255,255,255,.8);font-size:1rem;
  animation:pulse 2.5s infinite;
}
.idle-divider{
  width:320px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:32px auto;
}

/* ── STUDENT DISPLAY ── */
#studentScreen{
  position:fixed;inset:0;z-index:6;
  display:flex;align-items:center;justify-content:center;
  padding:40px;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
#studentScreen.active{opacity:1;pointer-events:auto;}
#idleScreen.hidden{opacity:0;pointer-events:none;}

.student-card{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:60px;
  align-items:center;
  max-width:1200px;width:100%;
}

/* Photo area */
.photo-wrap{
  position:relative;flex-shrink:0;
}
.photo-ring{
  width:clamp(220px,25vw,340px);
  height:clamp(220px,25vw,340px);
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold-dark));
  padding:5px;
  box-shadow:0 0 60px rgba(212,175,55,.5),0 0 120px rgba(212,175,55,.2);
  animation:borderGlow 3s ease-in-out infinite;
}
.photo-inner{
  width:100%;height:100%;border-radius:50%;
  overflow:hidden;background:var(--navy-mid);
  display:flex;align-items:center;justify-content:center;
}
.photo-inner img{width:100%;height:100%;object-fit:cover;}
.photo-avatar{
  font-size:clamp(4rem,10vw,7rem);
  background:linear-gradient(135deg,var(--navy-light),var(--blue));
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-light);font-family:'Cinzel',serif;font-weight:900;
}
.number-badge{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:var(--navy);font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(1rem,2.5vw,1.4rem);
  padding:8px 28px;border-radius:50px;
  box-shadow:0 4px 20px rgba(212,175,55,.5);
  white-space:nowrap;
}

/* Info area */
.student-info{display:flex;flex-direction:column;gap:16px;}
.info-label{
  font-size:clamp(.8rem,1.5vw,1rem);
  color:var(--gold);text-transform:uppercase;
  letter-spacing:.15em;font-weight:600;
}
.student-name{
  font-family:'Cinzel',serif;
  font-size:clamp(2rem,5vw,4.5rem);
  font-weight:900;
  color:#fff;
  line-height:1.1;
  text-shadow:0 0 40px rgba(255,255,255,.3);
  animation:glow 3s ease-in-out infinite;
}
.student-class{
  font-family:'Inter',sans-serif;
  font-size:clamp(1.2rem,3vw,2.2rem);
  font-weight:600;
  background:linear-gradient(135deg,var(--blue-light),#82B1FF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.congrats-text{
  font-size:clamp(1rem,2vw,1.4rem);
  color:rgba(255,255,255,.75);
  font-style:italic;
  border-left:3px solid var(--gold);
  padding-left:16px;
  line-height:1.6;
}

/* Celebration effects */
#confettiCanvas{position:fixed;inset:0;z-index:10;pointer-events:none;}

/* Controls */
#controls{
  position:fixed;bottom:24px;right:24px;z-index:20;
  display:flex;gap:12px;
}
.ctrl-btn{
  background:rgba(17,34,68,.85);
  border:1px solid rgba(212,175,55,.4);
  border-radius:12px;padding:10px 20px;
  color:#fff;cursor:pointer;font-size:.9rem;font-weight:600;
  backdrop-filter:blur(12px);transition:all .3s;
  display:flex;align-items:center;gap:6px;
}
.ctrl-btn:hover{border-color:var(--gold);background:rgba(212,175,55,.15);}

/* Back home */
#backBtn{position:fixed;top:20px;left:20px;z-index:20;}

/* Transition overlay */
#transOverlay{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(circle at center,#D4AF37 0%,#0A1628 100%);
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
#transOverlay.flash{animation:flashAnim .6s ease;}
@keyframes flashAnim{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}

/* Counter bar */
#progressBar{
  position:fixed;bottom:0;left:0;right:0;z-index:15;
  height:4px;background:rgba(255,255,255,.1);
}
#progressFill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
  transition:width .5s ease;width:0%;
}
</style>
</head>
<body>
<div class="bg-layer">
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
</div>

<canvas id="confettiCanvas"></canvas>
<div id="transOverlay"></div>

<!-- Back button -->
<a href="index.html" id="backBtn" class="ctrl-btn">🏠 Menu</a>

<!-- IDLE SCREEN -->
<div id="idleScreen">
  <div class="idle-logo">🎓</div>
  <div class="idle-school">SMP Negeri 5 Klaten</div>
  <div class="idle-event">Pelepasan<br>Kelas IX</div>
  <div class="idle-year">Tahun Pelajaran 2025/2026</div>
  <div class="idle-divider"></div>
  <div class="idle-hint">📡 Menunggu scan QR Code siswa…</div>
</div>

<!-- STUDENT SCREEN -->
<div id="studentScreen">
  <div class="student-card">
    <div class="photo-wrap">
      <div class="photo-ring">
        <div class="photo-inner" id="photoInner">
          <div class="photo-avatar" id="photoAvatar">?</div>
        </div>
      </div>
      <div class="number-badge" id="numberBadge">Siswa ke-0 dari 256</div>
    </div>
    <div class="student-info">
      <div class="info-label">✨ Dengan bangga kami memperkenalkan</div>
      <div class="student-name" id="studentName">Nama Siswa</div>
      <div class="student-class" id="studentClass">Kelas IX A</div>
      <div class="congrats-text" id="congratsText">
        Selamat atas keberhasilan menyelesaikan pendidikan di<br>
        <strong>SMP Negeri 5 Klaten</strong> dengan penuh semangat dan dedikasi.
      </div>
    </div>
  </div>
</div>

<!-- Controls -->
<div id="controls">
  <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <button class="ctrl-btn" onclick="resetDisplay()">↩ Reset</button>
</div>

<!-- Progress bar -->
<div id="progressBar"><div id="progressFill"></div></div>

<script src="js/students.js"></script>
<script>
// ── BroadcastChannel listener ──
const bc = new BroadcastChannel('pelepasan_ch');
bc.onmessage = (e) => {
  if (e.data.type === 'SHOW_STUDENT') showStudent(e.data.student);
  if (e.data.type === 'RESET') resetDisplay();
};

// ── Also listen localStorage (fallback) ──
window.addEventListener('storage', e => {
  if (e.key === 'currentStudent' && e.newValue) {
    const student = JSON.parse(e.newValue);
    showStudent(student);
  }
  if (e.key === 'resetDisplay') resetDisplay();
});

let currentStudent = null;
let confettiInterval = null;
let shownCount = parseInt(localStorage.getItem('shownCount') || '0');

function showStudent(student) {
  const overlay = document.getElementById('transOverlay');
  overlay.classList.add('flash');
  setTimeout(() => overlay.classList.remove('flash'), 700);

  setTimeout(() => {
    currentStudent = student;

    // Load photo
    const photo = localStorage.getItem(`photo_${student.id}`);
    const photoInner = document.getElementById('photoInner');
    if (photo) {
      photoInner.innerHTML = `<img src="${photo}" alt="${student.name}"/>`;
    } else {
      const initials = student.name.split(' ').slice(0,2).map(w=>w[0]).join('');
      photoInner.innerHTML = `<div class="photo-avatar">${initials}</div>`;
    }

    document.getElementById('studentName').textContent = student.name;
    document.getElementById('studentClass').textContent = `Kelas ${student.class} — No. ${student.classNumber}`;
    document.getElementById('numberBadge').textContent = `Siswa ke-${student.overallNumber} dari 256`;

    // Update shown count
    shownCount = student.overallNumber;
    localStorage.setItem('shownCount', shownCount);
    document.getElementById('progressFill').style.width = `${(shownCount/256)*100}%`;

    // Show student screen
    document.getElementById('idleScreen').classList.add('hidden');
    const ss = document.getElementById('studentScreen');
    ss.classList.add('active');

    // Confetti
    startConfetti();

    // TTS
    speakName(student);
  }, 300);
}

function resetDisplay() {
  stopConfetti();
  document.getElementById('studentScreen').classList.remove('active');
  document.getElementById('idleScreen').classList.remove('hidden');
  currentStudent = null;
}

// ── Text to Speech ──
function speakName(student) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const text = `Selamat kepada Ananda ${student.name} dari Kelas ${student.class}`;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'id-ID';
  utter.rate = 0.85;
  utter.pitch = 1.05;
  utter.volume = 1;

  // Try to get Indonesian voice
  const voices = window.speechSynthesis.getVoices();
  const idVoice = voices.find(v => v.lang.startsWith('id')) || voices.find(v => v.lang.startsWith('ms'));
  if (idVoice) utter.voice = idVoice;

  // After name, play applause sound
  utter.onend = () => playApplause();
  window.speechSynthesis.speak(utter);
}

// ── Applause using Web Audio ──
function playApplause() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const duration = 2.5;
    const bufSize = ctx.sampleRate * duration;
    const buf = ctx.createBuffer(2, bufSize, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < bufSize; i++) {
        const env = i < bufSize * 0.1 ? i / (bufSize * 0.1) :
                    i > bufSize * 0.7 ? (bufSize - i) / (bufSize * 0.3) : 1;
        data[i] = (Math.random() * 2 - 1) * env * 0.35;
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.value = 0.7;
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start();
  } catch(e) { console.log('Audio not available'); }
}

// ── Confetti ──
const canvas = document.getElementById('confettiCanvas');
const ctx2 = canvas.getContext('2d');
let confettiPieces = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function startConfetti() {
  stopConfetti();
  const colors = ['#D4AF37','#F5D96B','#FFD700','#FFFFFF','#42A5F5','#1565C0','#E91E63'];
  confettiPieces = Array.from({length:120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * 360,
    rotationSpeed: (Math.random() - 0.5) * 8,
    speedY: Math.random() * 3 + 1.5,
    speedX: (Math.random() - 0.5) * 2,
    opacity: Math.random() * 0.5 + 0.5,
  }));
  animateConfetti();
}

function stopConfetti() {
  cancelAnimationFrame(confettiInterval);
  ctx2.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces = [];
}

function animateConfetti() {
  ctx2.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces.forEach((p, i) => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += p.rotationSpeed;
    if (p.y > canvas.height + 20) {
      confettiPieces[i].y = -20;
      confettiPieces[i].x = Math.random() * canvas.width;
    }
    ctx2.save();
    ctx2.translate(p.x, p.y);
    ctx2.rotate(p.rotation * Math.PI / 180);
    ctx2.globalAlpha = p.opacity;
    ctx2.fillStyle = p.color;
    ctx2.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx2.restore();
  });
  confettiInterval = requestAnimationFrame(animateConfetti);
}

// ── Background particles ──
const particlesEl = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = ['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
  p.style.cssText = `
    left:${Math.random()*100}%;font-size:${12+Math.random()*20}px;
    animation-duration:${6+Math.random()*10}s;
    animation-delay:${Math.random()*10}s;
  `;
  particlesEl.appendChild(p);
}

// ── Fullscreen ──
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}

// ── Voices preload ──
window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
